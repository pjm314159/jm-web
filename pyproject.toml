[project]
name = "jm-web"
version = "2.0.0"
description = "JM comic web library with async crawler (Django + React)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "celery>=5.4",
    "redis>=5.0",
    "django-redis>=5.4",
    "jmcomic",
    "pillow>=10.0",
    "gunicorn>=21.0",
    "python-dotenv>=1.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "django-cors-headers>=4.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "pytest-env>=1.7.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations", ".venv", "frontend", "node_modules", "staticfiles"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async misuse
    "T20",      # print/TODO 检查（禁止 print）
]
ignore = [
    "E501",     # 行宽交由 formatter 处理
    "RUF001",   # 中文项目：全角字符误报
    "RUF002",
    "RUF003",
    "RUF012",   # Django Meta 的 ordering/indexes 为惯用法，非可变默认值缺陷
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "SIM117"]
"**/migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "JmWebProject.settings"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["JmWebProject"]
addopts = "-q --reuse-db --cov=comic --cov=user --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# pytest-env：在 pytest-django 加载 settings 之前注入环境变量
env = [
    "REGISTRATION_SECRET_KEY=test-registration-key",
    "DJANGO_SECRET_KEY=test-secret-key-0123456789abcdef0123456789abcdef",
    "ALLOWED_HOST=testserver",
    "DJANGO_LOG_LEVEL=WARNING",
]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]
