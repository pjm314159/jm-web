[package]
name = "jm-wasm-decoder"
version = "0.1.0"
edition = "2021"
description = "JM comic image descramble decoder (WASM)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }

[profile.release]
opt-level = "s"
lto = true
