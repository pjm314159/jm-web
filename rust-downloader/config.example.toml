# JM Downloader 配置
# 复制为 config.toml 后按需修改（可放在可执行文件同目录，或用 --config / JM_CONFIG_FILE 指定）
# 所有字段均可被同名环境变量覆盖（大写 + 下划线），环境变量优先级最高

[server]
listen_addr = "0.0.0.0:3080"
log_level = "info"              # trace | debug | info | warn | error

[redis]
url = "redis://127.0.0.1:6379/0"
key_prefix = "jmw:1:"      # 需与 Django 缓存 KEY_PREFIX:version 一致

[storage]
media_root = "./media"          # 需与 Django MEDIA_ROOT 指向同一目录

[download]
max_concurrency = 50            # 全局并发连接池大小
timeout_secs = 30               # 单请求超时
retry_times = 5                 # 单张图片最大重试
jitter_cap_ms = 2000            # 全抖动退避上限 (ms)
decode_concurrency = 10         # 反混淆并发数（0 = 不限制）
# proxy = "http://127.0.0.1:10808"   # 图片下载代理（不设置/留空则直连）

[task]
cleanup_on_failure = true       # 失败时删除不完整文件
retention_secs = 3600           # 已结束任务内存保留时长
max_queued = 200                # 排队上限，超出返回 503

[scanner]
interval_secs = 60              # 本地媒体扫描间隔
