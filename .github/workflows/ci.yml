name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    env:
      DJANGO_SETTINGS_MODULE: JmWebProject.settings
      DJANGO_SECRET_KEY: ci-test-key-not-for-production
      REGISTRATION_SECRET_KEY: ci-test-registration-key
      ALLOWED_HOST: 127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Prepare db directory
        run: mkdir -p JmWebProject/db

      - name: Ruff lint
        run: uv run ruff check JmWebProject/

      - name: Ruff format check
        run: uv run ruff format --check JmWebProject/

      - name: Run tests
        run: uv run pytest

      - name: Django system check
        run: uv run python JmWebProject/manage.py check

      - name: Check migrations
        run: uv run python JmWebProject/manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: uv run python JmWebProject/manage.py migrate

      - name: Collect static
        run: uv run python JmWebProject/manage.py collectstatic --noinput

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: TypeScript check + Build
        working-directory: frontend
        run: pnpm build

      - name: Oxlint
        working-directory: frontend
        run: pnpm lint

  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-downloader/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-downloader/Cargo.lock') }}

      - name: Check formatting
        working-directory: rust-downloader
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust-downloader
        run: cargo clippy -- -D warnings

      - name: Release build
        working-directory: rust-downloader
        run: cargo build --release

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build . -t jm-web:ci

      - name: Validate docker-compose
        run: |
          cp .env.example .env
          docker compose config

      - name: Start services
        run: |
          cp .env.example .env
          sed -i 's/ALLOWED_HOST=.*/ALLOWED_HOST=localhost/' .env
          sed -i 's/DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-test-key-not-for-production/' .env
          sed -i 's/REGISTRATION_SECRET_KEY=.*/REGISTRATION_SECRET_KEY=ci-test-reg/' .env
          docker compose up -d

      - name: Wait for services
        run: sleep 30

      - name: Health check (nginx + SPA)
        run: |
          curl -sf http://localhost:8000/ > /dev/null || (echo "Nginx/SPA failed" && docker compose logs nginx && exit 1)

      - name: Health check (Django API)
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/api/auth/token/ -H "Content-Type: application/json" -d '{}')
            if [ "$STATUS" != "502" ] && [ "$STATUS" != "000" ]; then
              echo "Django API responded with status $STATUS"
              exit 0
            fi
            sleep 3
          done
          echo "Django API failed"
          docker compose logs web
          exit 1

      - name: Stop services
        if: always()
        run: docker compose down
