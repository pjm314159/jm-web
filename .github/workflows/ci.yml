name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    env:
      DJANGO_SETTINGS_MODULE: JmWebProject.settings
      DJANGO_SECRET_KEY: ci-test-key-not-for-production
      REGISTRATION_SECRET_KEY: ci-test-registration-key
      ALLOWED_HOST: 127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff lint
        run: ruff check JmWebProject/

      - name: Django system check
        run: |
          cd JmWebProject
          python manage.py check

      - name: Check migrations
        run: |
          cd JmWebProject
          python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: |
          cd JmWebProject
          python manage.py migrate

      - name: Collect static
        run: |
          cd JmWebProject
          python manage.py collectstatic --noinput

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build . -t jm-web:ci

      - name: Validate docker-compose
        run: |
          cp .env.example .env
          docker-compose config

      - name: Start services
        run: docker-compose up -d

      - name: Wait for services
        run: sleep 20

      - name: Health check
        run: |
          curl -sf http://localhost:8000/ > /dev/null || (echo "Web service failed" && docker-compose logs web && exit 1)

      - name: Stop services
        if: always()
        run: docker-compose down
