upstream django {
    server web:8000;   # 对应 docker-compose 中 Django 服务的名称
}

server {
    listen 80;
    server_name _;        # 可替换为你的域名

    # 启用 Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;

    # 静态文件直接由 Nginx 提供
    location /static/ {
        alias /static/;   # 容器内静态文件目录，与 Django 的 STATIC_ROOT 一致
    }
    # 图片
    location /media/ {
        alias /app/JmWebProject/media/;
        # 可选：设置缓存控制
        expires 30d;
        add_header Cache-Control "public, immutable";
    }


    # 其他请求转发给 Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}