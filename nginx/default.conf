upstream django {
    server web:8000;
}

upstream rust_dl {
    server rust_downloader:3080;
}

server {
    listen 80;
    server_name _;        # 可替换为你的域名

    # 高效文件传输
    sendfile on;
    tcp_nopush on;

    # 启用 Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        text/xml
        image/svg+xml;

    # ─── Django 静态文件（admin 等） ───
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── 媒体文件（图片） ───
    location /media/images/ {
        alias /app/JmWebProject/media/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── 视频文件（nginx 直接服务，支持 Range） ───
    location /media/videos/ {
        alias /app/JmWebProject/media/videos/;
        mp4;
        sendfile on;
        aio threads;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── X-Accel-Redirect 内部视频直出（Django 鉴权后转发） ───
    location /internal_videos/ {
        internal;
        alias /app/JmWebProject/media/videos/;
        mp4;
        sendfile on;
        aio threads;
    }

    # ─── Rust 下载服务（状态轮询直达，不经 Django） ───
    location /api/v1/download/ {
        proxy_pass http://rust_dl;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── API 请求转发给 Django ───
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 视频流式播放需要较大 body 缓冲
        proxy_buffering off;
        client_max_body_size 100m;
    }

    # ─── Django Admin 后台 ───
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── 前端 SPA（React + Vite 构建产物） ───
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 路由回退：所有非文件请求返回 index.html
        try_files $uri $uri/ /index.html;
    }

    # 前端静态资源长缓存（Vite 构建带 hash）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WASM 文件正确 MIME 类型
    location ~* \.wasm$ {
        root /usr/share/nginx/html;
        types { application/wasm wasm; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}