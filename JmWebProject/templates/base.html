<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JmWebProject{% endblock %}</title>
    <style>
    :root {
        --primary-color: #2563eb; /* 现代蓝 */
        --primary-hover: #1d4ed8;
        --danger-color: #ef4444; /* 警告红 */
        --danger-hover: #dc2626;
        --bg-color: #f3f4f6;      /* 浅灰背景，不刺眼 */
        --card-bg: #ffffff;
        --text-main: #1f2937;
        --text-sub: #6b7280;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --radius: 12px;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 0;
        line-height: 1.5;
    }

    /* 顶部导航栏美化 */
    header {
        background: var(--card-bg);
        box-shadow: var(--shadow-sm);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    header a {
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
        margin: 0 10px;
        transition: color 0.2s;
    }
    header a:hover { color: var(--primary-color); }

    /* 主容器 */
    .container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
    }

    /* 按钮通用样式 */
    .btn {
        display: inline-flex;
        align-items: center;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.2s;
        border: none;
        cursor: pointer;
        font-size: 0.9rem;
    }
    .btn-primary { background: var(--primary-color); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger-color); color: white; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-outline { border: 1px solid #d1d5db; background: transparent; color: var(--text-main); }
    .btn-outline:hover { background: #f9fafb; border-color: #9ca3af; }

    /* 提示信息 */
    .success { color: #059669; background: #ecfdf5; padding: 10px; border-radius: 6px; margin-bottom: 10px;}
    .error { color: #dc2626; background: #fef2f2; padding: 10px; border-radius: 6px; margin-bottom: 10px;}
</style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center;">
            <a href="{% url 'index' %}" style="font-size: 1.2rem; font-weight: bold; color: var(--primary-color);">
                🚀 JmComic-Web
            </a>
            <nav style="margin-left: 20px;">
                <a href="{% url 'index' %}">首页</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'search' %}">在线搜索</a>
                    <a href="{% url 'jm_album_list' %}">JM 藏书阁</a>
                    <a href="{% url 'local_media' %}">本地资源</a>
                {% endif %}
            </nav>
        </div>

        <div style="display: flex; align-items: center;">
            {% if user.is_authenticated %}
                <span style="margin-right: 15px; color: var(--text-sub); font-size: 0.9rem;">
                    👤 {{ user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}" style="margin: 0;">
                    {% csrf_token %}
                    <button type="submit" class="btn" style="border: 1px solid var(--danger-color); color: var(--danger-color); background: transparent; padding: 4px 12px; font-size: 0.85rem;">
                        退出登录
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline" style="margin-right: 10px;">登录</a>
                <a href="{% url 'register' %}" class="btn btn-primary">注册</a>
            {% endif %}
        </div>
    </header>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
