{% extends "base.html" %}

{% block title %}{{ folder_name }} - 视频浏览{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<style>
    /* 页面基础与响应式布局 */
    .media-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
    }
    .header-actions {
        margin-bottom: 24px;
    }
    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        color: #4b5563;
        font-weight: 500;
        transition: color 0.2s;
    }
    .back-btn:hover { color: #2563eb; }
    .folder-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        font-size: 1.5rem;
        color: #1f2937;
    }

    /* 播放器与选集网格布局 */
    .player-layout {
        display: flex;
        gap: 24px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        padding: 20px;
        align-items: flex-start;
    }
    .video-section {
        flex: 3;
        min-width: 0; /* 防止 flex 撑破容器 */
        border-radius: 8px;
        overflow: hidden;
        background: #000;
    }
    .playlist-section {
        flex: 1;
        min-width: 280px;
        background: #f9fafb;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 200px); /* 限制高度，超出滚动 */
    }

    /* 选集列表样式 */
    .playlist-header {
        padding: 16px;
        background: #f3f4f6;
        border-bottom: 1px solid #e5e7eb;
        font-weight: 600;
        color: #374151;
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 8px 8px 0 0;
    }
    .playlist-items {
        overflow-y: auto;
        flex: 1;
    }
    .playlist-item {
        padding: 14px 16px;
        cursor: pointer;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #4b5563;
        transition: all 0.2s;
        font-size: 0.95rem;
        word-break: break-all;
    }
    .playlist-item:last-child { border-bottom: none; }
    .playlist-item:hover { background: #e5e7eb; }
    .playlist-item.active {
        background: #eff6ff;
        color: #2563eb;
        border-left: 4px solid #2563eb;
        font-weight: 500;
    }
    .playlist-item svg { flex-shrink: 0; width: 20px; height: 20px; }

    /* 小屏幕适配 */
    @media (max-width: 900px) {
        .player-layout { flex-direction: column; }
        .playlist-section { max-height: 400px; width: 100%; }
    }
</style>

<div class="media-container">
    <div class="header-actions">
        <a href="{% url 'local_media' %}" class="back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            返回本地资源库
        </a>
        <h2 class="folder-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
            </svg>
            {{ folder_name }}
            <span style="font-size: 0.9rem; color: #6b7280; font-weight: normal;">(共 {{ count }} 集)</span>
        </h2>
    </div>

    {% if files %}
    <div class="player-layout">
        <div class="video-section">
            <video id="player" playsinline controls preload="metadata">
                <source src="{{ first_video.url }}" type="video/mp4">
            </video>
            <div style="padding: 16px; background: #fff; color: #111827; font-weight: 600; font-size: 1.1rem;" id="current-title">
                {{ first_video.name }}
            </div>
        </div>

        <div class="playlist-section">
            <div class="playlist-header">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                </svg>
                选集
            </div>
            <div class="playlist-items">
                {% for file in files %}
                <div class="playlist-item {% if forloop.first %}active{% endif %}"
                     data-url="{{ file.url }}"
                     data-name="{{ file.name }}"
                     onclick="switchVideo(this)">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    {{ file.name }}
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    {% else %}
    <div style="text-align: center; padding: 50px; background: #fff; border-radius: 8px;">
        <p style="color: #6b7280;">该文件夹下没有视频文件。</p>
    </div>
    {% endif %}
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 初始化 Plyr 播放器
        const player = new Plyr('#player', {
            controls: [
                'play-large', 'play', 'progress', 'current-time', 'duration',
                'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'download', 'fullscreen'
            ],
            settings: ['speed', 'loop'],
            speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }, // 倍速设置
            i18n: {
                speed: '倍速',
                normal: '正常',
                download: '下载'
            }
        });

        // 切换视频的函数
        window.switchVideo = function(element) {
            // 1. 更新选集列表的高亮状态
            document.querySelectorAll('.playlist-item').forEach(el => {
                el.classList.remove('active');
            });
            element.classList.add('active');

            // 2. 获取视频数据
            const videoUrl = element.getAttribute('data-url');
            const videoName = element.getAttribute('data-name');

            // 3. 切换播放器源并自动播放
            player.source = {
                type: 'video',
                title: videoName,
                sources: [
                    {
                        src: videoUrl,
                        type: 'video/mp4',
                    }
                ]
            };
            player.play();

            // 4. 更新下方的标题
            document.getElementById('current-title').textContent = videoName;
        };
    });
</script>
{% endblock %}
