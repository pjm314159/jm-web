{% extends "base.html" %}

{% block title %}爬虫中心{% endblock %}

{% block content %}
<div class="container">
    <div style="max-width: 600px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: var(--shadow-sm);">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">🕷️ 新建下载任务</h2>
        
        <form id="crawl-form">
            {% csrf_token %}
            <div style="margin-bottom: 1.5rem;">
                <label for="input_id" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">JM ID 或 链接</label>
                <input type="text" name="input_id" id="input_id" placeholder="例如: 427413 或 链接..." 
                       style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem;">
                <p style="font-size: 0.85rem; color: var(--text-sub); margin-top: 5px;">
                    支持 Album ID (本子) 和 Photo ID (章节)。
                </p>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
                🚀 启动爬虫
            </button>
        </form>

        <div id="status-area" style="margin-top: 2rem; padding-top: 1rem; border-top: 1px dashed #e5e7eb;"></div>
        
        <div style="text-align: center; margin-top: 2rem;">
            <a href="{% url 'index' %}" class="btn btn-outline">返回首页</a>
            <a href="{% url 'jm_album_list' %}" class="btn btn-outline" style="margin-left: 10px;">查看已下载</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('crawl-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const statusArea = document.getElementById('status-area');
        
        statusArea.innerHTML = '<p style="color: var(--primary-color); text-align: center;">⏳ 正在连接 Celery 后台...</p>';

        try {
            const response = await fetch('{% url "start_crawl_api" %}', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            
            if (response.ok) {
                statusArea.innerHTML = `
                    <div class="success">
                        <strong>✅ 任务已提交!</strong><br>
                        Task ID: ${result.task_id}<br>
                        <span style="font-size: 0.9em">请耐心等待下载完成，可前往藏书阁查看。</span>
                    </div>`;
                form.reset(); 
            } else {
                statusArea.innerHTML = `<div class="error">❌ 错误: ${result.error}</div>`;
            }
        } catch (err) {
            statusArea.innerHTML = `<div class="error">❌ 网络请求失败</div>`;
        }
    });
</script>
{% endblock %}
