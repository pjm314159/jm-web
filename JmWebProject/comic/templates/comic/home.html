{% extends "base.html" %}

{% block title %}首页 - JmComic Web{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding-top: 3rem;">
    <h1 style="margin-bottom: 3rem; font-size: 2.5rem; color: var(--text-main);">🚀 欢迎回来，{{ user.username }}</h1>
    
    <div class="nav-grid">
        <a href="{% url 'search' %}" class="nav-card">
            <div class="icon">🔍</div>
            <h3>在线搜索</h3>
            <p>搜索 JM 站源，直接添加下载任务</p>
        </a>
        <a href="{% url 'crawl_page' %}" class="nav-card">
            <div class="icon">🕷️</div>
            <h3>爬虫中心</h3>
            <p>输入 ID 或链接，开始新的下载任务</p>
        </a>

        <a href="{% url 'jm_album_list' %}" class="nav-card">
            <div class="icon">📚</div>
            <h3>JM 藏书阁</h3>
            <p>浏览已下载的本子和章节</p>
        </a>

        <a href="{% url 'local_media' %}" class="nav-card">
            <div class="icon">📂</div>
            <h3>本地资源</h3>
            <p>浏览服务器上的本地文件夹</p>
        </a>
    </div>
</div>

<style>
    .nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 2rem;
        max-width: 1000px;
        margin: 0 auto;
    }

    .nav-card {
        background: white;
        padding: 3rem 2rem;
        border-radius: 16px;
        box-shadow: var(--shadow-md);
        text-decoration: none;
        color: var(--text-main);
        transition: transform 0.3s, box-shadow 0.3s;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .nav-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--primary-color);
    }

    .nav-card .icon { font-size: 4rem; margin-bottom: 1rem; }
    .nav-card h3 { margin: 0.5rem 0; font-size: 1.5rem; }
    .nav-card p { color: var(--text-sub); margin: 0; }
</style>
{% endblock %}
