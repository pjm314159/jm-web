services:
  redis:
    image: redis:alpine
    container_name: jm_redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 192m

  # Django Web service
  web:
    build: .
    image: pjm314159/jm-web:latest
    container_name: jm_django_web
    volumes:
      - ./JmWebProject/media:/app/JmWebProject/media
      - db_data:/app/JmWebProject/db
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=false
      - REDIS_URL=redis://redis:6379/0
      - RUST_DOWNLOADER_URL=http://rust_downloader:3080
      - CRAWL_CALLBACK_URL=http://web:8000
    depends_on:
      - redis
      - rust_downloader
    restart: unless-stopped
    mem_limit: 512m

  # Rust 下载微服务（替代 Celery Worker + Beat）
  rust_downloader:
    build:
      context: ./rust-downloader
      dockerfile: Dockerfile
    image: pjm314159/jm-rust-downloader:latest
    container_name: jm_rust_downloader
    volumes:
      - ./JmWebProject/media:/app/JmWebProject/media
    environment:
      - LISTEN_ADDR=0.0.0.0:3080
      - REDIS_URL=redis://redis:6379/0
      - MEDIA_ROOT=/app/JmWebProject/media
      - MAX_CONCURRENCY=50
      - RETRY_TIMES=5
      - JITTER_CAP_MS=2000
      - TIMEOUT_SECS=30
      - SCAN_INTERVAL_SECS=60
      - CLEANUP_ON_FAILURE=true
      - TASK_RETENTION_SECS=3600
      - MAX_QUEUED_TASKS=200
      - RUST_LOG=info
    depends_on:
      - redis
    ports:
      - "3080:3080"
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: pjm314159/jm-nginx:latest
    container_name: jm_nginx
    volumes:
      - ./JmWebProject/static:/static
      - ./JmWebProject/media:/app/JmWebProject/media
    ports:
      - "8000:80"
    depends_on:
      - web
    restart: unless-stopped
    mem_limit: 128m

volumes:
  redis_data:
  db_data: