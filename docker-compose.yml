services:
  redis:
    image: redis:alpine
    container_name: jm_redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 192m

  # Django Web service
  web:
    build: .
    image: pjm314159/jm-web:latest
    container_name: jm_django_web
    volumes:
      - ./JmWebProject/media:/app/JmWebProject/media
      - db_data:/app/JmWebProject/db
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=false
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    mem_limit: 512m

  # Celery Worker + Beat（内嵌定时调度）
  celery_worker:
    build: .
    image: pjm314159/jm_celery:latest
    user: "root"
    container_name: jm_celery_worker
    volumes:
      - ./JmWebProject/media:/app/JmWebProject/media
      - db_data:/app/JmWebProject/db
    command: celery -A JmWebProject worker --loglevel=info --pool=threads -B
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - web
    restart: unless-stopped
    mem_limit: 1g

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: pjm314159/jm-nginx:latest
    container_name: jm_nginx
    volumes:
      - ./JmWebProject/static:/static
      - ./JmWebProject/media:/app/JmWebProject/media
    ports:
      - "8000:80"
    depends_on:
      - web
    restart: unless-stopped
    mem_limit: 128m

volumes:
  redis_data:
  db_data: